server:
  port: 8080

spring:
  application:
    name: realtime-chat
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/realtime_chat}
    username: ${DB_USERNAME:chat_user}
    password: ${DB_PASSWORD:chat_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: realtime-chat
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.realtimechat.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hellomeomoc@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          ssl:
            protocols: ${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:100MB}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-change-me}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  mail:
    from: ${MAIL_FROM:hellomeomoc@gmail.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
  upload:
    location: ${UPLOAD_DIR:uploads}
    max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
  clickhouse:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/realtime_chat_analytics}
    username: ${CLICKHOUSE_USER:analytics_user}
    password: ${CLICKHOUSE_PASSWORD:analytics_password}
  kafka:
    topics:
      message-created: chat.message.created
      message-persisted: chat.message.persisted
      message-read: chat.message.read
      presence-changed: chat.presence.changed
      notification-requested: chat.notification.requested
      analytics-raw: chat.analytics.raw

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
