name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend-build:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend package
        run: mvn -B -pl backend -DskipTests package

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B -pl backend "-Dtest=!*IntegrationTest" test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: realtime_chat
          POSTGRES_USER: chat_user
          POSTGRES_PASSWORD: chat_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chat_user -d realtime_chat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: realtime_chat_analytics
          CLICKHOUSE_USER: analytics_user
          CLICKHOUSE_PASSWORD: analytics_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 8123:8123
          - 9000:9000
    env:
      DB_URL: jdbc:postgresql://localhost:5433/realtime_chat?options=-c%20TimeZone=UTC
      DB_USERNAME: chat_user
      DB_PASSWORD: chat_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      CLICKHOUSE_URL: jdbc:clickhouse://localhost:8123/realtime_chat_analytics
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      UPLOAD_STORAGE: LOCAL
      JWT_SECRET: ci-jwt-secret-value-with-enough-length-for-hmac-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run integration tests
        run: mvn -B -pl backend "-Dtest=*IntegrationTest" test

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependencies and filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - unit-tests
      - integration-tests
      - dependency-scan
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      image-tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/backend"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest_tag=${IMAGE}:latest" >> "${GITHUB_OUTPUT}"

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "${{ steps.image.outputs.image_tag }}" \
            --tag "${{ steps.image.outputs.latest_tag }}" \
            backend

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.image_tag }}"
          docker push "${{ steps.image.outputs.latest_tag }}"

  deploy-demo:
    name: Deploy demo
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: demo
    env:
      DEMO_HOST: ${{ secrets.DEMO_HOST }}
      DEMO_USER: ${{ secrets.DEMO_USER }}
      DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
      DEMO_DEPLOY_DIR: ${{ secrets.DEMO_DEPLOY_DIR }}
      DEMO_DEPLOY_COMMAND: ${{ secrets.DEMO_DEPLOY_COMMAND }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      BACKEND_IMAGE: ${{ needs.docker-image.outputs.image-tag }}
    steps:
      - name: Check demo deploy configuration
        shell: bash
        run: |
          test -n "${DEMO_HOST}"
          test -n "${DEMO_USER}"
          test -n "${DEMO_SSH_PRIVATE_KEY}"
          test -n "${DEMO_DEPLOY_DIR}"
          test -n "${DEMO_DEPLOY_COMMAND}"

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${DEMO_SSH_PRIVATE_KEY}" > ~/.ssh/demo_deploy_key
          chmod 600 ~/.ssh/demo_deploy_key
          ssh-keyscan -H "${DEMO_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy backend image to demo host
        shell: bash
        run: |
          ssh -i ~/.ssh/demo_deploy_key "${DEMO_USER}@${DEMO_HOST}" \
            "cd '${DEMO_DEPLOY_DIR}' && BACKEND_IMAGE='${BACKEND_IMAGE}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' ${DEMO_DEPLOY_COMMAND}"
